name: Update verified data jobs

on:
  schedule:
    - cron: '17 0,9 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-jobs
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r automation/requirements.txt
      - name: Collect and verify postings
        run: python automation/update_jobs.py
      - name: Commit changed feed
        run: |
          if git diff --quiet -- jobs.json automation/state.json automation/review-queue.json; then
            echo "No verified changes"
            exit 0
          fi
          git config user.name "ssafy-data-jobs-bot"
          git config user.email "actions@users.noreply.github.com"
          git add jobs.json automation/state.json automation/review-queue.json
          git commit -m "Update verified data job feed"
          git push
