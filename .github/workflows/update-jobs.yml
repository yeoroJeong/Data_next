name: Update verified data jobs

on:
  schedule:
    - cron: '17 0,9 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-jobs
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r automation/requirements.txt
      - name: Test collection rules
        run: python -m unittest automation.test_update_jobs
      - name: Collect and verify postings
        run: python automation/update_jobs.py
      - name: Commit changed feed
        run: |
          if git diff --quiet -- jobs.json automation/state.json automation/review-queue.json; then
            echo "No verified changes"
            exit 0
          fi
          git config user.name "ssafy-data-jobs-bot"
          git config user.email "actions@users.noreply.github.com"
          git add jobs.json automation/state.json automation/review-queue.json
          git commit -m "Update verified data job feed"
          git push
      - name: Confirm published feed
        run: |
          python - <<'PY'
          import json, time, urllib.request
          from pathlib import Path
          expected = json.loads(Path('jobs.json').read_text())
          url = 'https://raw.githubusercontent.com/yeoroJeong/Data_next/main/jobs.json'
          for attempt in range(6):
              try:
                  with urllib.request.urlopen(url + '?run=' + str(time.time_ns()), timeout=20) as response:
                      actual = json.load(response)
                  if actual == expected:
                      print(f"Verified remote feed: {len(actual['jobs'])} postings")
                      break
              except Exception as error:
                  print(type(error).__name__)
              time.sleep(10)
          else:
              raise SystemExit('Remote feed does not match collected data')
          PY
